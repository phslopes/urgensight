[project]
name = "urgensight"
version = "0.3.0"
description = "Sistema de triagem automatica de exames de texto (laudos medicos)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "prometheus-client>=0.20",
    # Necessarios para desserializar models/model.pkl na API.
    # numpy fica fixado na versao das constraints do Airflow: o modelo e
    # treinado la e carregado aqui (ver ADR-0007).
    "scikit-learn==1.5.1",
    "joblib>=1.4.0",
    "numpy==1.26.4",
    "dill>=0.3.8",
]

[dependency-groups]
# Preparacao de dados e treino: src/prepare_dataset.py, src/train.py e o
# container do Airflow. Nao entra na imagem da API.
pipeline = [
    "pandas==2.1.4",
    "requests>=2.31.0",
    "dvc>=3.67",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
    { include-group = "pipeline" },
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.uv]
# Projeto sem [build-system]: nao ha pacote a construir/instalar, apenas
# um ambiente a sincronizar. uv.lock ja registra source = { virtual = "." };
# esta chave torna isso explicito e estavel entre versoes do uv.
package = false
