[project]
name = "urgensight"
version = "0.3.0"
description = "Sistema de triagem automatica de exames de texto (laudos medicos)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "prometheus-client>=0.20",
    # Necessarios para desserializar models/model.pkl na API.
    # numpy e pandas ficam fixados na versao das constraints do Airflow: o
    # modelo e treinado la e carregado aqui (ver ADR-0007).
    # pandas e requests estao aqui (e nao no grupo pipeline) por causa da
    # cadeia de import de src.app -> src.train -> src.prepare_dataset:
    # load_pipeline() precisa de train.py, que importa pandas diretamente
    # e importa as constantes TARGET_COLUMN/TEXT_COLUMN/VALID_TARGETS de
    # prepare_dataset.py no module-level -- e prepare_dataset.py importa
    # requests no module-level (para baixar o dataset bruto), mesmo que a
    # API nunca chame essa funcionalidade. Sem os dois instalados no
    # runtime da API, a desserializacao do pickle falha com
    # ModuleNotFoundError e o /health responde 503 (risco R2, ADR-0007).
    # Confirmado localmente ao validar o build Docker da API nesta tarefa:
    # o acoplamento entre train.py e prepare_dataset.py extrapola o risco
    # descrito originalmente (que citava so pandas) -- ver task-5-report.md
    # para o diagnostico completo. A correcao definitiva (desacoplar essas
    # constantes de prepare_dataset.py para nao arrastar requests para a
    # API) fica fora do escopo desta tarefa e deve ser avaliada na ADR-0007.
    "scikit-learn==1.5.1",
    "joblib>=1.4.0",
    "numpy==1.26.4",
    "pandas==2.1.4",
    "requests>=2.31.0",
    "dill>=0.3.8",
]

[dependency-groups]
# Preparacao de dados e treino: src/prepare_dataset.py, src/train.py e o
# container do Airflow. Nao entra na imagem da API.
# (requests foi promovido a dependencia direta -- ver comentario acima.)
pipeline = [
    "dvc>=3.67",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
    { include-group = "pipeline" },
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.uv]
# Projeto sem [build-system]: nao ha pacote a construir/instalar, apenas
# um ambiente a sincronizar. uv.lock ja registra source = { virtual = "." };
# esta chave torna isso explicito e estavel entre versoes do uv.
package = false
# dvc nao fixa aiohttp/yarl -- eles chegam transitivos via dvc-http/scmrepo
# -> aiohttp-retry -> aiohttp -> yarl. Sem pin, `uv lock` escolhe as versoes
# mais recentes, que conflitam com o pin oficial das constraints do Airflow
# (aiohttp==3.9.5 / yarl==1.9.4) e quebram o build de Dockerfile.airflow com
# um "pin duplo" (--constraint por cima de um uv export ja resolvido para
# outra versao). Fixar aqui faz o uv.lock nascer compativel com o Airflow
# (ver ADR-0007).
constraint-dependencies = ["aiohttp==3.9.5", "yarl==1.9.4"]
